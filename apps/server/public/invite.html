<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>蓝喵速递 - 邀请链接</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);min-height:100vh;display:flex;align-items:center;justify-content:center}
.card{background:rgba(255,255,255,0.95);border-radius:20px;padding:32px 24px;max-width:360px;width:90%;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,0.3);backdrop-filter:blur(20px)}
.avatar{width:80px;height:80px;border-radius:50%;margin:0 auto 16px;background:linear-gradient(135deg,#a78bfa,#ec4899);display:flex;align-items:center;justify-content:center;font-size:32px;color:#fff;overflow:hidden}
.avatar img{width:100%;height:100%;object-fit:cover}
h1{font-size:20px;color:#1a1a2e;margin-bottom:6px}
.info{color:#666;font-size:13px;margin-bottom:20px}
.btn{display:inline-block;padding:12px 32px;border-radius:12px;font-size:15px;font-weight:600;text-decoration:none;margin:6px;transition:transform 0.15s}
.btn:active{transform:scale(0.96)}
.btn-primary{background:linear-gradient(135deg,#667eea,#764ba2);color:#fff}
.loading{color:#999;font-size:14px}
.error{color:#e74c3c;font-size:14px}
</style>
</head>
<body>
<div class="card" id="card">
  <div class="loading">加载中...</div>
</div>
<script>
const path=window.location.pathname;
const m=path.match(/\/i\/([^\/]+)/);
const card=document.getElementById('card');
async function load(){
  try{
    if(!m){card.innerHTML='<div class="error">无效的邀请链接</div>';return;}
    const token=m[1];
    const resp=await fetch(window.location.origin+'/api/public/invite/token/'+token);
    const data=await resp.json();
    if(data.error){card.innerHTML='<div class="error">'+data.error+'</div>';return;}
    if(data.type==='group'){
      const deep='lanmiao://join-group/'+data.groupNumber;
      card.innerHTML=
        '<div class="avatar">'+(data.avatar?'<img src="'+data.avatar+'" alt="">':'👥')+'</div>'+
        '<h1>'+data.name+'</h1>'+
        '<div class="info">群号：'+data.groupNumber+' · '+data.memberCount+' 位成员<br>加入方式：'+(data.joinMode==='open'?'开放加入':data.joinMode==='approval'?'需要审批':'需要回答问题')+'</div>'+
        '<a class="btn btn-primary" href="'+deep+'">打开蓝喵速递加入群聊</a>'+
        '<div style="margin-top:12px;font-size:12px;color:#999">蓝喵速递 · 端到端加密通讯</div>';
    }else{
      const deep='lanmiao://open-user/'+data.userId;
      card.innerHTML=
        '<div class="avatar">'+(data.avatar?'<img src="'+data.avatar+'" alt="">':'👤')+'</div>'+
        '<h1>'+data.name+'</h1>'+
        '<div class="info">用户ID：'+data.userId+'</div>'+
        '<a class="btn btn-primary" href="'+deep+'">打开蓝喵速递添加好友</a>'+
        '<div style="margin-top:12px;font-size:12px;color:#999">蓝喵速递 · 端到端加密通讯</div>';
    }
  }catch(e){
    card.innerHTML='<div class="error">'+(e.message||'加载失败')+'</div>';
  }
}
load();
</script>
</body>
</html>
